<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <title>Scoreboard</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="scoreboard">
      <!-- ================= WINNER ================= -->

      <!-- ================= WINNER POPUP ================= -->

      <div id="winnerOverlay" class="winner-overlay">
        <div class="winner-popup">
          <div class="winner-trophy">🏆</div>

          <div id="winnerTitle" class="winner-title"></div>

          <div id="winnerMessage" class="winner-message">WINS!</div>

          <button type="button" id="closeWinner" class="winner-close">
            OK
          </button>
        </div>
      </div>
      <!-- ================= TOP SECTION ================= -->

      <div class="top-section">
        <!-- PLAYER 1 -->
        <div class="player-side">
          <label class="image-upload">
            <input
              type="file"
              class="image-input"
              data-player="1"
              accept="image/*"
            />

            <img id="playerImage1" src="images/player1.jpg" alt="Player 1" />
          </label>

          <input type="text" id="name1" class="player-name" value="Player 1" />
        </div>

        <!-- RACE NUMBER 1 -->
        <div class="race-number">
          <input type="number" id="race1" value="0" min="1" />
        </div>

        <!-- RACE -->
        <div class="race-title">RACE</div>

        <!-- RACE NUMBER 2 -->
        <div class="race-number">
          <input type="number" id="race2" value="0" min="1" />
        </div>

        <!-- PLAYER 2 -->
        <div class="player-side">
          <label class="image-upload">
            <input
              type="file"
              class="image-input"
              data-player="2"
              accept="image/*"
            />

            <img id="playerImage2" src="images/player2.jpg" alt="Player 2" />
          </label>

          <input type="text" id="name2" class="player-name" value="Player 2" />
        </div>
      </div>

      <!-- ================= HORIZONTAL DIVIDER ================= -->

      <div class="horizontal-divider"></div>

      <!-- ================= SCORE SECTION ================= -->

      <div class="score-section">
        <!-- PLAYER 1 -->

        <div class="score-side">
          <div class="score-label">Score</div>

          <div class="score-number" id="score1">0</div>

          <div class="score-buttons">
            <button type="button" id="subtract1" class="score-button subtract">
              -1
            </button>

            <button type="button" id="add1" class="score-button add">+1</button>
          </div>
        </div>

        <!-- VERTICAL DIVIDER -->

        <div class="vertical-divider"></div>

        <!-- PLAYER 2 -->

        <div class="score-side">
          <div class="score-label">Score</div>

          <div class="score-number" id="score2">0</div>

          <div class="score-buttons">
            <button type="button" id="subtract2" class="score-button subtract">
              -1
            </button>

            <button type="button" id="add2" class="score-button add">+1</button>
          </div>
        </div>
      </div>

      <!-- ================= RESET ================= -->

      <div class="reset-container">
        <button type="button" id="resetButton" class="reset-button">
          Reset
        </button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
